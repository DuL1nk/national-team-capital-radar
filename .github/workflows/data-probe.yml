name: Public data connectivity probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node automation/probe.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-source-probe
          path: probe-results.json
          retention-days: 7
