name: Daily data refresh
run-name: Daily data refresh · ${{ inputs.recovery && 'watchdog' || github.event_name }} · ${{ github.run_number }}
on:
  schedule:
    - cron: '15 1 * * *' # 09:15 Asia/Shanghai
    - cron: '47 1,2 * * *' # 09:47 / 10:47 retry after delayed/dropped delivery
    - cron: '45 3 * * *' # 11:45 recovery; skip if today's anonymous hash matches
    - cron: '23 1-15 * * *' # 09:23-23:23 Asia/Shanghai: hourly stale-report recovery
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish only after validation (false for first cloud trial)'
        type: boolean
        default: false
      recovery:
        description: 'Watchdog recovery: respect report window and verified-current skip'
        type: boolean
        default: false
# GitHub schedules are best effort. Staggered retries share the same serial,
# fail-closed publisher; a verified current report skips all expensive work.
concurrency:
  group: national-team-data-refresh
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  build:
    if: github.repository == 'DuL1nk/national-team-capital-radar'
    runs-on: ubuntu-latest
    timeout-minutes: 75 # 34m observed collection + up to 14m source-readiness backoff + safety margin
    permissions:
      contents: write
      pages: read
    outputs:
      publish: ${{ steps.mode.outputs.publish == 'true' && steps.freshness.outputs.run == 'true' }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Record trigger receipt and check recovery guard
        env:
          TRIGGER_EVENT: ${{ github.event_name }}
          TRIGGER_SCHEDULE: ${{ github.event.schedule }}
        run: |
          node automation/test-freshness.mjs
          node automation/test-recovery.mjs
          node -e 'const f=require("node:fs"); f.appendFileSync(process.env.GITHUB_STEP_SUMMARY, "## Trigger receipt\n\nEvent: " + process.env.TRIGGER_EVENT + "\n\nSchedule (UTC): " + (process.env.TRIGGER_SCHEDULE || "manual") + "\n\nRunner started: " + new Date().toISOString() + "\n\nPrimary/retries: 09:15 / 09:47 / 10:47 / 11:45; hourly stale-report recovery: 09:23-23:23 Asia/Shanghai. Anonymous current date/hash skips duplicate work. All deliveries remain best effort. A missing schedule run has no runner receipt.\n");'
      - name: Select publication mode
        id: mode
        env:
          PUBLISH_REQUEST: ${{ inputs.publish || github.event_name == 'schedule' }}
        run: echo "publish=$PUBLISH_REQUEST" >> "$GITHUB_OUTPUT"
      - name: Avoid duplicate successful daily publication
        id: freshness
        env:
          RECOVERY_REQUEST: ${{ inputs.recovery || false }}
        run: node automation/should-run.mjs
      - uses: actions/setup-python@v5
        if: steps.freshness.outputs.run == 'true'
        with:
          python-version: '3.12'
      - run: pip install -r automation/requirements.txt
        if: steps.freshness.outputs.run == 'true'
      - name: Fetch, calculate and validate (no model)
        if: steps.freshness.outputs.run == 'true'
        run: node automation/pipeline.mjs
      - name: Package static-only website
        if: steps.freshness.outputs.run == 'true'
        run: node automation/package.mjs
      - uses: actions/upload-artifact@v4
        if: always() && steps.freshness.outputs.run == 'true'
        with:
          name: data-audit-${{ github.run_id }}
          path: |
            build/source_audit.json
            build/source_failure.json
            build/readiness.json
            build/directory_audit.json
            build/calculation_gates.json
            build/validation.json
            build/study_validation.log
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: steps.mode.outputs.publish != 'true' && steps.freshness.outputs.run == 'true'
        with:
          name: validated-cloud-preview
          path: build/deploy
          retention-days: 7
      - name: Commit durable public data and reports
        if: steps.mode.outputs.publish == 'true' && steps.freshness.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html site-status.json four-study-status.json public-source-audit.json national_team_capital_monitor_*.html hs300_four_etf_backtest*.html automation/state/baseline.json.gz automation/state/manifest.json automation/watchlist.md
          git diff --cached --quiet || git commit -m "Refresh public data $(date -u +%F) [skip ci]"
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' push origin HEAD:main
      - uses: actions/configure-pages@v5
        if: steps.mode.outputs.publish == 'true' && steps.freshness.outputs.run == 'true'
      - uses: actions/upload-pages-artifact@v4
        if: steps.mode.outputs.publish == 'true' && steps.freshness.outputs.run == 'true'
        with:
          path: build/deploy
  deploy:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy same GitHub Pages site
        id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Anonymous date and hash verification
        run: node automation/verify.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-verification-${{ github.run_id }}
          path: build/public-verification.json
          retention-days: 14
  health:
    name: Final health and bounded recovery
    needs: [build, deploy]
    if: always() && github.repository == 'DuL1nk/national-team-capital-radar'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
      issues: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node automation/test-recovery.mjs
      - name: Verify public state and finalize automatic alert
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVERY_FINISHED_RUN: ${{ github.run_id }}
          PUBLISHER_RESULT: ${{ needs.build.result }}/${{ needs.deploy.result }}
        run: node automation/watchdog.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: health-${{ github.run_id }}
          path: build/watchdog.json
          retention-days: 14
